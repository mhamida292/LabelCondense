name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    # Oldest runner available: PyInstaller bundles link against the build
    # host's glibc, and glibc is forward-compatible only, so building here
    # is what lets the binary start on Ubuntu 22.04 and everything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript python3-tk binutils
      - run: pip install pyinstaller pillow pytest
      # Parity tests skip without PACKING_TEST_PDF (real exports carry
      # customer data and are never committed); the rest all run.
      - run: pytest -v
      - run: python packaging/collect_binaries.py
      - run: pyinstaller --clean --noconfirm packaging/packing.spec
      - name: Smoke-test the bundle against the glibc floor
        run: packaging/smoke_test.sh tests/fixtures/smoke.pdf
        continue-on-error: true      # no committed fixture yet; see README
      - uses: actions/upload-artifact@v4
        with:
          name: label-condense-linux
          path: dist/label-condense

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyinstaller pillow pytest
      # Binaries first: the Linux job installs gs/poppler before pytest, and
      # the parity tests shell out to them the moment a fixture is available.
      - run: powershell -File packaging/fetch_windows_binaries.ps1
      - run: pytest -v
      - run: pyinstaller --clean --noconfirm packaging/packing.spec
      - uses: actions/upload-artifact@v4
        with:
          name: label-condense-windows
          path: dist/label-condense.exe

  macos:
    # Apple Silicon. Homebrew's libraries here require macOS 14.8 (the step
    # below prints the floor); the release notes promise that.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: brew install ghostscript poppler
      - run: pip install pyinstaller pillow pytest
      - run: pytest -v
      - run: python packaging/collect_binaries.py
      - run: pyinstaller --clean --noconfirm packaging/packing.spec
      - name: Smoke-test the app with Homebrew hidden
        run: packaging/smoke_test_macos.sh
      - name: Show the oldest macOS the bundle accepts
        run: |
          find "dist/Label Condense.app" -type f -print0 | xargs -0 file | grep Mach-O | cut -d: -f1 |
            while read -r f; do otool -l "$f" | awk '/minos/ {print $2}'; done | sort -V | tail -1
      - run: cd dist && ditto -c -k --keepParent "Label Condense.app" LabelCondense-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: label-condense-macos
          path: dist/LabelCondense-mac.zip

  release:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/label-condense-linux/label-condense
            artifacts/label-condense-windows/label-condense.exe
            artifacts/label-condense-macos/LabelCondense-mac.zip
          body: |
            Download one file and double-click it. Nothing to install.

            - **Windows:** `label-condense.exe`. Windows will warn that it is
              unsigned — choose **More info → Run anyway**.
            - **Linux:** `label-condense`. Run `chmod +x label-condense` once.
              Needs glibc 2.35 or newer (Ubuntu 22.04+).
            - **Mac:** `LabelCondense-mac.zip` (Apple Silicon, macOS 14.8 Sonoma or newer).
              Unzip it and drag **Label Condense** into Applications. It is
              unsigned, so the first open is refused: open **System Settings →
              Privacy & Security**, scroll down and click **Open Anyway**.

            Bundles Ghostscript (AGPL) and Poppler (GPL) — see NOTICE.md.
